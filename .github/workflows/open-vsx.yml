name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (leave empty for latest)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "*.vsix" --clobber
          else
            gh release download --repo "${{ github.repository }}" --pattern "*.vsix" --clobber
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX }}
        run: npx -y ovsx publish *.vsix -p "$OVSX_PAT"
